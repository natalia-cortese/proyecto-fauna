name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: todos los tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Correr todos los tests
        run: npm test
